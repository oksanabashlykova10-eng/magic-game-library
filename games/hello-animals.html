<!DOCTYPE html>
<html lang="en" data-site-game-id="hello-animals">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Animals</title>
<style>
  *{box-sizing:border-box}
  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#151222;
    font-family:Arial,sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 25%,rgba(255,190,80,.12),transparent 25%),
      radial-gradient(circle at 85% 75%,rgba(42,162,180,.12),transparent 28%),
      #151222;
  }

  #stage{
    position:relative;
    width:min(98vw, calc(96vh * 1619 / 971));
    aspect-ratio:1619 / 971;
    max-height:96vh;
    overflow:hidden;
    transition:width .15s ease, aspect-ratio .15s ease;
  }

  #stage.final-mode{
    width:min(98vw, calc(96vh * 1672 / 941));
    aspect-ratio:1672 / 941;
  }

  .screen{
    position:absolute;
    inset:0;
    display:none;
  }
  .screen.active{display:block}

  .screen-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:fill;
    user-select:none;
    pointer-events:none;
  }

  button{
    position:absolute;
    margin:0;
    padding:0;
    border:0;
    background:transparent;
    cursor:pointer;
    outline:none;
  }

  .close-question{
    left:82.21%;
    top:7.00%;
    width:6.36%;
    height:8.35%;
    border-radius:50%;
  }

  .speaker{
    left:46.18%;
    top:41.61%;
    width:6.79%;
    height:10.71%;
    border-radius:50%;
  }

  .speaker.speaking::after{
    content:"";
    position:absolute;
    inset:-7%;
    border-radius:50%;
    box-shadow:0 0 0 4px rgba(255,255,255,.32),0 0 20px rgba(16,171,181,.95);
    animation:speakerPulse .7s ease-in-out infinite alternate;
  }

  @keyframes speakerPulse{
    to{
      transform:scale(1.08);
      box-shadow:0 0 0 4px rgba(255,255,255,.2),0 0 28px rgba(16,171,181,1);
    }
  }

  .progress{
    position:absolute;
    left:41.25%;
    top:26.35%;
    width:15.58%;
    height:3.70%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
  }

  .dot{
    width:10.8%;
    aspect-ratio:1;
    border-radius:50%;
    background:#e9dbc2;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.13);
  }

  .dot.current{
    background:#0c8790;
    box-shadow:0 0 0 3px rgba(255,255,255,.34),0 0 12px rgba(12,135,144,.55);
  }

  .dot.done{
    background:#0c8790;
    box-shadow:0 0 0 3px #efc55f,0 0 11px rgba(239,197,95,.55);
  }

  /* Exact card coordinates measured from the 1619 × 971 reference */
  .animal-card{
    top:55.82%;
    height:28.63%;
    border-radius:13%;
  }

  .fox{
    left:13.28%;
    width:14.02%;
  }

  .rabbit{
    left:28.59%;
    width:13.40%;
  }

  .dog{
    left:42.87%;
    width:13.90%;
  }

  .bear{
    left:57.27%;
    width:13.90%;
  }

  .cat{
    left:71.65%;
    width:13.90%;
  }

  .animal-card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    opacity:0;
    transition:opacity .16s ease, box-shadow .16s ease;
    pointer-events:none;
  }

  /* Highlight is attached to the same percentage rectangle as the animal card.
     It cannot drift when the screen scales. */
  .animal-card:hover::before{
    opacity:1;
    box-shadow:
      0 0 0 3px rgba(255,255,255,.72),
      0 0 18px rgba(255,214,95,.78),
      inset 0 0 0 2px rgba(255,227,144,.38);
  }

  .animal-card.correct::before{
    opacity:1;
    box-shadow:
      0 0 0 3px rgba(255,255,255,.74),
      0 0 20px rgba(100,190,78,.72),
      inset 0 0 0 3px rgba(100,190,78,.86);
  }

  .animal-card.wrong::before{
    opacity:1;
    box-shadow:
      0 0 0 3px rgba(255,255,255,.74),
      0 0 20px rgba(220,91,73,.64),
      inset 0 0 0 3px rgba(220,91,73,.86);
  }

  .animal-card::after{
    position:absolute;
    left:50%;
    top:2%;
    transform:translate(-50%,-50%);
    width:19%;
    aspect-ratio:1;
    min-width:34px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    color:#fff;
    font:bold clamp(20px,2vw,34px)/1 Arial,sans-serif;
    border:3px solid rgba(255,255,255,.86);
    box-shadow:0 5px 12px rgba(0,0,0,.17);
  }

  .animal-card.correct::after{
    content:"✓";
    display:flex;
    background:linear-gradient(#7bd069,#50a744);
  }

  .animal-card.wrong::after{
    content:"×";
    display:flex;
    background:linear-gradient(#e77a68,#cb5142);
  }

  .close-final{
    left:90.07%;
    top:4.57%;
    width:5.44%;
    height:9.03%;
    border-radius:50%;
  }

  .play-again{
    left:29.43%;
    top:82.36%;
    width:19.49%;
    height:8.93%;
    border-radius:999px;
  }

  .back-library{
    left:50.61%;
    top:82.36%;
    width:22.49%;
    height:8.93%;
    border-radius:999px;
  }

  .final-action::before{
    content:"";
    position:absolute;
    inset:-18%;
    border-radius:999px;
    background:radial-gradient(ellipse at center,rgba(255,220,120,.82),rgba(255,231,164,.25) 50%,transparent 72%);
    filter:blur(9px);
    opacity:0;
    transition:opacity .18s ease,transform .18s ease;
    pointer-events:none;
  }

  .final-action:hover::before{
    opacity:1;
    transform:scale(1.06);
  }

  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
</style>
</head>
<body>
<main id="stage">
  <section id="questionScreen" class="screen active">
    <img
      class="screen-image"
      src="https://img.genially.com/67961b32a116fb001568a75e/57805191-1d91-4877-a86c-d17a94a5c70a.png"
      alt=""
    >

    <button class="close-question" id="closeQuestion">
      <span class="sr-only">Back to library</span>
    </button>

    <button class="speaker" id="speaker">
      <span class="sr-only">Listen again</span>
    </button>

    <div class="progress" id="progress"></div>

    <button class="animal-card fox" data-animal="fox"><span class="sr-only">fox</span></button>
    <button class="animal-card rabbit" data-animal="rabbit"><span class="sr-only">rabbit</span></button>
    <button class="animal-card dog" data-animal="dog"><span class="sr-only">dog</span></button>
    <button class="animal-card bear" data-animal="bear"><span class="sr-only">bear</span></button>
    <button class="animal-card cat" data-animal="cat"><span class="sr-only">cat</span></button>
  </section>

  <section id="finalScreen" class="screen">
    <img
      class="screen-image"
      src="https://img.genially.com/67961b32a116fb001568a75e/9e17f66b-f0ec-4209-abba-28e8d4aeab39.png"
      alt=""
    >

    <button class="close-final" id="closeFinal">
      <span class="sr-only">Back to library</span>
    </button>

    <button class="final-action play-again" id="playAgain">
      <span class="sr-only">Play again</span>
    </button>

    <button class="final-action back-library" id="backLibrary">
      <span class="sr-only">Back to the library</span>
    </button>
  </section>
</main>

<script>
(() => {
  const WORDS = ["dog", "rabbit", "cat", "bear", "fox"];
  const POSITIVE = ["Great job!", "Well done!", "Excellent!"];
  const NEGATIVE = "Try again!";

  const stage = document.getElementById("stage");
  const questionScreen = document.getElementById("questionScreen");
  const finalScreen = document.getElementById("finalScreen");
  const speaker = document.getElementById("speaker");
  const progress = document.getElementById("progress");
  const cards = [...document.querySelectorAll(".animal-card")];

  let order = [];
  let step = 0;
  let locked = false;
  let speechToken = 0;

  function shuffle(source){
    const a = [...source];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function voice(){
    const voices=speechSynthesis.getVoices();
    return voices.find(v=>/en-US/i.test(v.lang)&&/Jenny|Aria|Samantha|Google|Female/i.test(v.name))
      || voices.find(v=>/^en/i.test(v.lang))
      || null;
  }

  function stopSpeech(){
    speechToken++;
    speechSynthesis.cancel();
    speaker.classList.remove("speaking");
  }

  function speak(text,{rate=.82,pitch=1.04,word=false}={}){
    return new Promise(resolve=>{
      const token=++speechToken;
      speechSynthesis.cancel();

      const utterance=new SpeechSynthesisUtterance(text);
      utterance.lang="en-US";
      utterance.rate=rate;
      utterance.pitch=pitch;
      utterance.volume=1;

      const selected=voice();
      if(selected) utterance.voice=selected;

      utterance.onstart=()=>{
        if(word&&token===speechToken) speaker.classList.add("speaking");
      };

      const finish=()=>{
        if(token===speechToken){
          speaker.classList.remove("speaking");
          resolve();
        }
      };

      utterance.onend=finish;
      utterance.onerror=finish;

      setTimeout(()=>speechSynthesis.speak(utterance),35);
    });
  }

  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  function drawProgress(){
    progress.innerHTML="";
    WORDS.forEach((_,i)=>{
      const dot=document.createElement("span");
      dot.className="dot";
      if(i<step) dot.classList.add("done");
      if(i===step&&step<WORDS.length) dot.classList.add("current");
      progress.appendChild(dot);
    });
  }

  function clearStates(){
    cards.forEach(card=>card.classList.remove("correct","wrong"));
  }

  async function sayCurrent(){
    if(locked||step>=order.length) return;
    await speak(order[step],{rate:.72,pitch:1.08,word:true});
  }

  async function choose(card){
    if(locked) return;
    locked=true;

    const correct=card.dataset.animal===order[step];

    if(correct){
      clearStates();
      card.classList.add("correct");

      const phrase=POSITIVE[Math.floor(Math.random()*POSITIVE.length)];
      await speak(phrase,{rate:.84,pitch:1.07});
      await wait(170);

      step++;
      drawProgress();

      if(step>=order.length){
        showFinal();
        return;
      }

      clearStates();
      locked=false;
      await wait(260);
      sayCurrent();
    }else{
      card.classList.add("wrong");
      await speak(NEGATIVE,{rate:.82,pitch:.98});
      await wait(120);
      card.classList.remove("wrong");
      locked=false;
    }
  }

  function showFinal(){
    stopSpeech();
    questionScreen.classList.remove("active");
    finalScreen.classList.add("active");
    stage.classList.add("final-mode");
  }

  async function restart(){
    stopSpeech();
    order=shuffle(WORDS);
    step=0;
    locked=true;
    clearStates();
    drawProgress();

    finalScreen.classList.remove("active");
    questionScreen.classList.add("active");
    stage.classList.remove("final-mode");

    await wait(450);
    locked=false;
    sayCurrent();
  }

  function backToLibrary(){
    stopSpeech();
    window.parent.postMessage({type:"BACK_TO_LIBRARY",game:"hello-animals"},"*");
    try{location.hash="library"}catch(e){}
  }

  cards.forEach(card=>card.addEventListener("click",()=>choose(card)));
  speaker.addEventListener("click",()=>{
    if(!locked){
      stopSpeech();
      sayCurrent();
    }
  });

  document.getElementById("playAgain").addEventListener("click",restart);
  document.getElementById("backLibrary").addEventListener("click",backToLibrary);
  document.getElementById("closeQuestion").addEventListener("click",backToLibrary);
  document.getElementById("closeFinal").addEventListener("click",backToLibrary);

  speechSynthesis.onvoiceschanged=()=>{};
  restart();
})();
</script>

<script>
(function(){
  var GAME_ID = document.documentElement.getAttribute("data-site-game-id") || "";
  var sent = false;
  function complete(){
    if(sent) return;
    sent = true;
    try{ window.parent.postMessage({type:"GAME_COMPLETED", game:GAME_ID}, "*"); }catch(e){}
  }
  function watch(){
    var nodes = [
      document.getElementById("finalScreen"),
      document.getElementById("finalOverlay")
    ].filter(Boolean);
    nodes.forEach(function(node){
      function check(){
        if(node.classList.contains("active") || node.classList.contains("show")) complete();
      }
      new MutationObserver(check).observe(node,{attributes:true,attributeFilter:["class","style"]});
      check();
    });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",watch);
  else watch();
})();
</script>

</body>
</html>
